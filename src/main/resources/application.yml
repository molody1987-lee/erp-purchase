server:
  port: 8080

spring:
  application:
    name: erp-purchase
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    # HikariCP：启动时强制验证 DB 连接，连接失败则应用启动失败
    hikari:
      initialization-fail-timeout: 30000
      connection-timeout: 10000


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Spring Boot Actuator —— K8s 健康检查用
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      # 关键：readiness 健康组必须包含 db，这样 DB 挂了 Pod 会被摘出流量
      # liveness 不能包含 db，否则 DB 抖动会导致容器雪崩重启
      group:
        readiness:
          include: "readinessState,db"
        liveness:
          include: "livenessState"
  health:
    defaults:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true