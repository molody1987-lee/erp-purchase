# ERP 采购系统 K8s 部署清单
# 注意：
# 1. 容器名必须是 erp —— CI 里的 `kubectl set image deployment/erp erp=<镜像>` 覆盖的就是它
# 2. image 是占位符，每次部署会被 set image 替换为 commit SHA 对应的镜像
# 3. 数据库连接通过环境变量覆盖 application.yml 里的 localhost 配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp
  labels:
    app: erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp
  template:
    metadata:
      labels:
        app: erp
    spec:
      # ACR 私有仓库的拉取凭证；若仓库设为公开，可删除下面两行
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: erp
          image: busybox:1          # 占位，部署时立即被 set image 覆盖
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # Spring Boot 会把 SPRING_DATASOURCE_* 绑定到 spring.datasource.*，
            # 覆盖 application.yml 中指向 localhost 的配置
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://<改成你的MySQL地址>:3306/erp_purchase?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "erp_purchase_write"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "<改成你的MySQL密码>"
---
apiVersion: v1
kind: Service
metadata:
  name: erp
spec:
  type: ClusterIP              # 需要公网访问时改为 LoadBalancer
  selector:
    app: erp
  ports:
    - port: 8080
      targetPort: 8080
