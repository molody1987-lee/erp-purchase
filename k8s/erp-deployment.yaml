apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp
  labels:
    app: erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp
  template:
    metadata:
      labels:
        app: erp
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: erp
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "${SPRING_PROFILES_ACTIVE}"
            - name: SPRING_DATASOURCE_URL
              value: "${DB_URL}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "${DB_USERNAME}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "${DB_PASSWORD}"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: erp
  labels:
    app: erp
spec:
  selector:
    app: erp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
