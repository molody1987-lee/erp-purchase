name: CI + Deploy

on:
  push:
    branches: [ "test","release/**"]
  pull_request:
    branches: [ "test","release/**" ]

jobs:
  ci:
    uses: molody1987-lee/reusable-workflows/.github/workflows/java-ci.yml@main
    with:
      java-version: '21'
  deploy:
    needs: ci
    permissions:
      id-token: write
      contents: read
    uses: molody1987-lee/reusable-workflows/.github/workflows/deploy-aliyun.yml@main
    with:
      environment: production
      spring-profiles-active: ${{ vars.SPRING_PROFILES_ACTIVE }}
    secrets:
      ALIYUN_ROLE_ARN: ${{ secrets.ALIYUN_ROLE_ARN }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ALIYUN_KUBECONFIG: ${{ secrets.ALIYUN_KUBECONFIG }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}